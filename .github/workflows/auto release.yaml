name: Release automático en creacion de tag

on: [create]

permissions:
  contents: write

jobs:
  export_game:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    name: Exportar y crear release
    
    steps:
      - name: checkout
        uses: actions/checkout@v5
      
      - name: Exportar presets
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          relative_project_path: ./
          export_debug: true
          archive: true
          cache: true

      # - name: Crear artefacto
      #   uses: actions/upload-artifact@v7.0.1
      #   with:
      #     name: resultados-${{ github.run_number }}
      #     path: ./build/*
      #     retention-days: 0
      #     overwrite: true

      - name: Crear release
        uses: ncipollo/release-action@v1.18.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generateReleaseNotes: true
          tag: ${{ github.ref_name }}
          artifacts: ${{ steps.export.outputs.archive_directory }}/*
