name: Make debug builds
on:
  push:
    tags: 'v*'
jobs:
  export_presets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    name: Exportar
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: export game
        id: export
        uses: firebelley/godot-export@v8.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          relative_project_path: ./
          relative_export_path: ./build
          export_debug: true
          cache: true

      - name: Crear artefacto
        uses: actions/upload-artifact@v7.0.1
        with:
          name: resultados-${{ github.run_number }}
          path: ./build/*
          retention-days: 0
          overwrite: true
          archive: true
        
